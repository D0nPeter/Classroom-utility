<!DOCTYPE html>
<html lang="en">
  <head>  
    <meta charset="UTF-8">
    <title id="title"> Single mode </title>
  </head>

  <!-- Scripts at the end of DOM -->
  <link rel="stylesheet" href="single.css">

  <div class="upper_bar">
    <h class="title" data-i18n="title-single"> Single mode</h>
    <button class="language_button_la" onclick="changeLanguage('la')"> </button>
    <button class="language_button_de" onclick="changeLanguage('de')"> </button>
    <button class="language_button_en" onclick="changeLanguage('en')"> </button>
    <button class="language_button_pl" onclick="changeLanguage('pl')"> </button>
  </div>

  <body>
    <div class="range_form" id="range_form">
      <div class="range_form_content"> 
        <label for="lowest_number" data-i18n="lowest-number"> <b> Lowest number </b> </label>
        <input type="number" placeholder="Enter number" data-i18n-placeholder="enter-number" id="lowest_number" required>

        <label for="highest_number" data-i18n="highest-number"> <b> Highest number </b></label>
        <input type="number" placeholder="Enter number" data-i18n-placeholder="enter-number" id="highest_number" required>

        <label for="excluded_numbers" data-i18n="excluded-numbers"> <b> Excluded numbers </b></label>
        <input type="tel" placeholder="Enter numbers" data-i18n-placeholder="enter-numbers" id="excluded_numbers">
        
        <div class="range_form_button_parent">
          <button onclick="hideRangeForm()" data-i18n="cancel"> Cancel </button>
          <button onclick="setValues()" data-i18n="confirm"> Confirm </button>
        </div>
      </div>
    </div>
    
    <div>
      <canvas id="wheel_canvas" data-i18n="canvas-not-supported" class="wheel_canvas" width="1000" height="1000" >
        You browser does not support canvas
      </canvas>
    </div>

    <div class="main">
      <p data-i18n="the-number-is" class="result_text"> The number is: </p>
      <p id="result_display" class="result_display"> </p>
      

      <div class="main_buttons_parent">
        <button onclick="spinWheel()" data-i18n="generate" class="generate_button"> Generate </button>
  
        <div class="modify_buttons_parent">
          <button onclick="showRangeForm()" data-i18n="modify-values"> Modify values </button>
          <button onclick="fillPool()" data-i18n="reset-values"> Reset values </button>
        </div>
      </div>
    </div>

  </body>

  <script src="single.js"></script>
  <script src="lang.js"></script>
</html>
