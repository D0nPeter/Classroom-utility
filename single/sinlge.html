<!DOCTYPE html>
<html lang="en">
  <head>  
    <meta charset="UTF-8">
    <title id="title"> Single mode </title>
  </head>

  <script src="single.js"></script>
  <script src="lang.js"></script>

  <button onclick="changeLanguage('en')">English</button>
  <button onclick="changeLanguage('pl')">Polski</button>
  <br> <!-- should be later removed -->

  <body onload="changeLanguage(getPreferredLanguage())">

    <div class="range_form_parent" id="range_form_parent" style="display: none;"> 
      <label for="lowest_number" data-i18n="lowest-number"> <b> Lowest number </b> </label>
      <input type="number" placeholder="Enter number" data-i18n-placeholder="enter-number" id="lowest_number" required>
      <br> <!-- should be later removed -->

      <label for="highest_number" data-i18n="highest-number"> <b> Highest number </b></label>
      <input type="number" placeholder="Enter number" data-i18n-placeholder="enter-number" id="highest_number" required>
      <br> <!-- should be later removed -->

      <label for="excluded_numbers" data-i18n="excluded-numbers"> <b> Excluded numbers </b></label>
      <input type="tel" placeholder="Enter numbers" data-i18n-placeholder="enter-numbers" id="excluded_numbers">
      <br> <!-- should be later removed -->

      <button onclick="hideRangeForm()" data-i18n="cancel"> Cancel </button>
      <button onclick="setValues()" data-i18n="confirm"> Confirm </button>
    </div>

    <button onclick="showRangeForm()" data-i18n="modify-values"> Modify values </button>
    <button onclick="fillPool()" data-i18n="reset-values"> Reset values </button> <br> <br>
    <button onclick="randomSingle()" data-i18n="generate"> Generate </button>
    <p data-i18n="the-number-is"> The number is: </p>
    <p id="result_display"> </p>
  </body>
</html>
