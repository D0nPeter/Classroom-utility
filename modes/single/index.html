<!DOCTYPE html>
<html lang="en">
  <head>  
    <meta charset="UTF-8">
    <title id="title"> Single mode </title>
    <link rel="icon" href="../../image/favicons/Wheel_single.svg">

    <script src="single.js" defer></script>
    <script src="../../script/lang.js" defer></script>
    <script src="../../script/style.js" defer></script>

    <link rel="stylesheet" href="single.css">
    <link rel="stylesheet" href="../../style/common.css">
    <link rel="stylesheet" href="../../style/themes/froggy.css" id="theme_link">
  </head>
  
  <body class="background_color">
    <header class="upper_navbar">
      <h1 class="title navbar_text" data-i18n="title-single"> Single mode</h1>
      <button class="language_button_la" onclick="changeLanguage('la')"> </button>
      <button class="language_button_de" onclick="changeLanguage('de')"> </button>
      <button class="language_button_en" onclick="changeLanguage('en')"> </button>
      <button class="language_button_pl" onclick="changeLanguage('pl')"> </button>
    </header>

    <aside id="sidenav" class="sidenav">
      <div class="sidenav_buttons">
        <button id="sidenav_button_right" class="sidenav_button_right" onclick="openSidenav()" > </button>
        <button id="sidenav_button_left" class="sidenav_button_left" onclick="closeSidenav()" > </button>
      </div>

      <div class="sidenav_navigation">
        <h2 class="navbar_text" data-i18n="navigation"> NAVIGATION </h2>
        <a class="navbar_text" data-i18n="main-page" href="../../index.html"> Main Page </a>
        <a class="navbar_text" data-i18n="single-mode" href="javascript:void(0)"> Single Mode </a>
        <a class="navbar_text" data-i18n="text-mode" href="../text/index.html"> Text Mode </a>
      </div>

      <div class="sidenav_themes">
        <h2 class="navbar_text" data-i18n="themes"> THEMES </h2>
        <button id="theme_froggy" class="navbar_text" data-i18n="theme-froggy" onclick="changeTheme('froggy')"> Froggy </button>
        <button id="theme_space"  class="navbar_text" data-i18n="theme-space" onclick="changeTheme('space')"> Space </button>
      </div>
    </aside>

    <div class="range_form" id="range_form">
      <div class="range_form_content"> 
        <label for="lowest_number" data-i18n="lowest-number"> Lowest number </label>
        <input type="number" placeholder="Enter number" data-i18n-placeholder="enter-number" id="lowest_number" required>

        <label for="highest_number" data-i18n="highest-number"> Highest number </b></label>
        <input type="number" placeholder="Enter number" data-i18n-placeholder="enter-number" id="highest_number" required>

        <label for="excluded_numbers" data-i18n="excluded-numbers"> Excluded numbers </label>
        <input type="text" placeholder="Enter numbers" data-i18n-placeholder="enter-numbers" id="excluded_numbers">

        <label for="removed-numbers" data-i18n="removed-after-drawn"> Removed after being drawn </label>
        <p type="text" data-i18n="no-removed-numbers" class="removed_numbers" id="removed_numbers"> No removed numbers </p>
        
        <div class="range_form_button_parent">
          <button onclick="hideRangeForm()" data-i18n="cancel"> Cancel </button>
          <button onclick="setValues()" data-i18n="confirm"> Confirm </button>
        </div>
      </div>
    </div>
    
    <div class="main">
      <canvas id="wheel_canvas" data-i18n="canvas-not-supported" class="wheel_canvas" width="900" height="800" >
        You browser does not support canvas.
      </canvas>

      <div class="menu">
        <p data-i18n="the-number-is" class="result_text body_text"> The number is: </p>
        <p id="result_display" class="result_display body_text"> </p>
        
        <div class="menu_buttons_parent">
          <button onclick="spinWheel()" id="generate_button" data-i18n="generate" class="generate_button"> Generate </button>
          <button onclick="removeLastNumber()" id="remove_button" data-i18n="remove-number" class="remove_button"> Remove </button>
    
          <div class="modify_buttons_parent">
            <button onclick="showRangeForm()" data-i18n="modify-values"> Modify values </button>
            <button onclick="refillPool()" data-i18n="reset-values"> Reset values </button>
          </div>
        </div>
      </div>

      <div id="wheel_colors" class="wheel_colors">
        <div id="wheel_color_1" class="wheel_color_1"></div>
        <div id="wheel_color_2" class="wheel_color_2"></div>
        <div id="wheel_color_3" class="wheel_color_3"></div>
      </div>
    </div>
  </body>
</html>
